name: Bundle install
description: >-
  Install gems into vendor/bundle with a cache. Used by jobs that run inside
  the Ruby container on the self-hosted runner, where ruby/setup-ruby cannot
  install prebuilt Rubies.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: bundle-${{ runner.os }}-ruby-3.4.4-bookworm-${{ hashFiles('Gemfile.lock') }}
    - name: Install gems
      shell: bash
      run: |
        bundle config set --local path vendor/bundle
        bundle config set --local frozen true
        bundle install --jobs 4
