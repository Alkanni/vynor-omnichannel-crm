name: 🐞 Bug
description: Laporkan perilaku yang salah atau error
title: 'fix(scope): '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Apa yang salah, dalam satu sampai tiga kalimat.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Buka ...
        2. Klik ...
        3. Terlihat error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Lokal (development)
        - Stack vynor-ce
        - Pilot / production
        - Lainnya (jelaskan di Summary)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log, screenshot, ID conversation/inbox, dan waktu kejadian. Jangan tempelkan token, password, atau data pribadi pelanggan.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Boleh dikosongkan; agent melengkapinya saat triage.
      placeholder: |
        - [ ] Given ..., When ..., Then ...
