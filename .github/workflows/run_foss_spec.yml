name: Run Chatwoot CE spec
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Merges to main in quick succession only test the newest commit;
# other events get a unique group, so PR and manual runs are never cancelled
concurrency:
  group: ${{ github.event_name == 'push' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

# Container jobs default to sh; the shard script relies on bash arrays
defaults:
  run:
    shell: bash

jobs:
  # Separate linting jobs for faster feedback
  lint-backend:
    runs-on: self-hosted
    # Self-hosted runner: never run code from fork PRs on the owner's machine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Keep the Ruby version in sync with .ruby-version
    container: ruby:3.4.4-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bundle-install
      - name: Run Rubocop
        run: bundle exec rubocop --parallel

  security-scan:
    runs-on: self-hosted
    # Self-hosted runner: never run code from fork PRs on the owner's machine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Keep the Ruby version in sync with .ruby-version
    container: ruby:3.4.4-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bundle-install
      - name: Run Brakeman
        # Non-blocking for now: Brakeman surfaces 35 pre-existing findings
        # (13 High confidence) that need security-team triage before this
        # can be turned into a hard gate.
        continue-on-error: true
        run: bundle exec brakeman -q --no-pager
      - name: Run bundle-audit
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

  lint-frontend:
    runs-on: self-hosted
    # Self-hosted runner: never run code from fork PRs on the owner's machine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm i
      - name: Run ESLint
        run: pnpm run eslint

  # Frontend tests run in parallel with backend
  frontend-tests:
    runs-on: self-hosted
    # Self-hosted runner: never run code from fork PRs on the owner's machine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install pnpm dependencies
        run: pnpm i
      - name: Run frontend tests
        run: pnpm run test:coverage

  # Backend tests with parallelization
  backend-tests:
    runs-on: self-hosted
    # Self-hosted runner: never run code from fork PRs on the owner's machine
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Keep the Ruby version in sync with .ruby-version
    container: ruby:3.4.4-bookworm
    strategy:
      fail-fast: false
      # A single self-hosted runner executes shards one after another,
      # so fewer shards keep the per-shard setup overhead down
      matrix:
        ci_node_total: [4]
        ci_node_index: [0, 1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ''
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        options: --entrypoint redis-server

    # Services are reached by name from the job container, so no host ports
    # are published (they would clash with other stacks on the runner host)
    env:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - uses: ./.github/actions/bundle-install

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm i

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Create database
        run: bundle exec rake db:create

      - name: Seed database
        run: bundle exec rake db:schema:load

      - name: Run backend tests (parallelized)
        run: |
          # Get all spec files and split them using round-robin distribution
          # This ensures slow tests are distributed evenly across all nodes
          SPEC_FILES=($(find spec -name '*_spec.rb' | sort))
          TESTS=""

          for i in "${!SPEC_FILES[@]}"; do
            # Assign spec to this node if: index % total == node_index
            if [ $(( i % ${{ matrix.ci_node_total }} )) -eq ${{ matrix.ci_node_index }} ]; then
              TESTS="$TESTS ${SPEC_FILES[$i]}"
            fi
          done

          if [ -n "$TESTS" ]; then
            bundle exec rspec --profile=10 --format progress --format json --out tmp/rspec_results.json $TESTS
          fi
        env:
          # vite_ruby builds test assets on demand; the default heap OOMs on smaller runners
          NODE_OPTIONS: --openssl-legacy-provider --max-old-space-size=4096

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results-${{ matrix.ci_node_index }}
          path: tmp/rspec_results.json

      - name: Upload rails log folder
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rails-log-folder-${{ matrix.ci_node_index }}
          path: log
