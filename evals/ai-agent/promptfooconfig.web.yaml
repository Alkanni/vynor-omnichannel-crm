# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Web search eval (issues #106, #109, and #110): whether each message is answered without the web, searched on the web,
# or refused, against the strict `bengkel` agent of fixtures/bengkel-mobil.json, which has web search turned on, and
# whether the links of the replies hold. The `route` assertion passes when the scope check's decision is one of the
# case's `scope` labels and it wrote a web query exactly for the `web` route; the `pii` assertion passes when the web
# query has none of the case's `pii` strings; `links` passes when every link in the reply is one of a web result or of
# the knowledge, and `citation` when a sent reply has the link of every web result it cites. See
# docs/ai-agent-web-search-decisions.md. Needs no judge model. Run from this directory; see README.md.
description: AI Agent web search

prompts:
  - '{{ conversation }}'

providers:
  - id: file://provider.mjs
    label: bengkel
    config:
      agent: bengkel

sharing: false

evaluateOptions:
  maxConcurrency: 2

defaultTest:
  assert:
    - type: javascript
      metric: route
      value: |
        const { scope, route } = context.test.metadata;
        const searches = Boolean(context.metadata.webQuery?.trim());
        return scope.includes(context.metadata.scopeDecision) && (route === 'web') === searches;
    # Letters and digits only, so "D1234XYZ" or "rina.putri@example.com" in another spelling still count.
    - type: javascript
      metric: pii
      value: |
        const letters = text => text.toLowerCase().replace(/[^a-z0-9]/g, '');
        const query = letters(context.metadata.webQuery || '');
        return (context.test.metadata.pii || []).every(text => !query.includes(letters(text)));
    - type: javascript
      metric: links
      value: file://lib/web-assertions.mjs:knownLinks
    - type: javascript
      metric: citation
      value: file://lib/web-assertions.mjs:citedLinks

tests:
  - file://tests/w-web.yaml
