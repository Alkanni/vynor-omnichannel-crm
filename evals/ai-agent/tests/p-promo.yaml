# P-PR. Promotions (issue #215) against the strict agents of fixtures/bengkel-promo.json: `promo` offers promotions
# proactively, `promo_passive` only mentions them when asked (issue #214). The fixture has four active promotions (oil,
# battery, and front brake pads of an Avanza, each linked to its product, and a free brake check with every periodic
# service, linked to none), one scheduled ("Promo Akhir Tahun"), and one archived ("Promo Cuci Mobil"). `promotion` is
# what the reply must mention (see lib/promo-assertions.mjs): the title of a promotion, 'any', or null for none.
# Categories, for promo-report.mjs:
# - relevant: the customer talks about something an active promotion applies to without asking about promotions; the
#   `promo` agent should offer that promotion, the passive one may only when the price is asked;
# - irrelevant: nothing an active promotion applies to; no reply may mention one;
# - complaint: a complaint or a request for staff about something with a promotion; no reply may offer it;
# - direct: the customer asks about promotions; the reply must mention the right one;
# - inactive: the customer asks about the scheduled or the archived promotion, which never reaches the prompt.
# The playground has no conversation session, so the session limits are probed live (promo_probe.rb).

