# Kasus retrieval untuk agent eval "large" (fixtures/toko-roti-large.json). `expected` berisi sumber yang diterima
# (judul knowledge source atau nama produk), satu per baris; kasus lulus bila salah satunya ada di peringkat 1-5.
# Kasus tanpa `expected` tidak punya jawaban di knowledge dan lulus hanya bila tidak ada chunk yang diambil.
# Draf dari agent untuk issue #80 (knowledge sintetis); tim mengoreksinya seperti dataset #71.

