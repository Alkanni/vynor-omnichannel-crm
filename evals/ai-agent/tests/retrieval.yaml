# Multi-turn: pesan terakhir pelanggan bergantung pada giliran sebelumnya. Query disusun seperti balasan runtime saat
# ini (pesan pelanggan setelah baris "AI:" terakhir).
- description: 'R-M01: Kalau beli 3 totalnya berapa? (lanjutan Roti Sobek Pandan)'
  metadata: { id: R-M01, category: multi-turn }
  vars:
    conversation: |-
      Ada Roti Sobek Pandan?
      AI: Ada, harganya Rp26.000.
      Kalau beli 3 totalnya berapa?
    expected: Roti Sobek Pandan

- description: 'R-M02: Bisa dikirim ke Jakarta? (lanjutan hampers Imlek)'
  metadata: { id: R-M02, category: multi-turn }
  vars:
    conversation: |-
      Saya mau pesan hampers Imlek.
      AI: Hampers Imlek isi 8 toples kue kering harganya Rp480.000.
      Bisa dikirim ke Jakarta?
    expected: |-
      Kebijakan toko
      Apakah bisa kirim ke luar kota?

- description: 'R-M03: Ini mengandung kacang nggak? (lanjutan Croissant Almond)'
  metadata: { id: R-M03, category: multi-turn }
  vars:
    conversation: |-
      Croissant almond ada?
      AI: Ada, harganya Rp23.000.
      Ini mengandung kacang nggak?
    expected: |-
      Apakah ada produk yang mengandung kacang?
      Croissant Almond

- description: 'R-M04: Stoknya masih ada? (lanjutan Bolu Pandan)'
  metadata: { id: R-M04, category: multi-turn }
  vars:
    conversation: |-
      Berapa harga Bolu Pandan?
      AI: Bolu Pandan Rp55.000 per loyang 20 cm.
      Stoknya masih ada?
    expected: Bolu Pandan

