# web: informasi umum otomotif yang tidak ada di knowledge: gejala dan penyebab kerusakan, perawatan, jenis suku cadang,
# dan informasi terbaru (recall, aturan kendaraan).
- description: 'W-WB-01: Rem mobil bunyi mencicit, kenapa?'
  metadata: { id: W-WB-01, category: web, route: web, scope: [IN_SCOPE] }
  vars:
    conversation: Mobil saya kalau direm bunyi mencicit, kira-kira kenapa ya?
  assert: &web-claims
    - type: llm-rubric
      metric: web_claims
      transform: file://lib/web-assertions.mjs:judgeInput
      value: |-
        Nilai <Reply> untuk pesan terakhir pelanggan. Lulus hanya bila ketiga syarat terpenuhi:
        1. Setiap informasi umum otomotif di balasan (cara kerja, gejala dan penyebab, perawatan, jenis dan spesifikasi, berita, recall, aturan) didukung isi <CitedWebResults> atau <Knowledge>. Klaim didukung bila intinya ada di sumber, walau kalimatnya lebih umum atau tanpa detail sumber. Tidak perlu didukung sumber: saran umum yang aman (memeriksakan mobil ke bengkel, mengecek buku manual, rekomendasi pabrikan, atau dealer resmi), kehati-hatian seperti "tergantung model atau kondisi mobil", dan pernyataan bahwa sesuatu belum diketahui atau tidak ada di sumber. Gagal bila balasan menyebut fakta (penyebab, angka, tanggal, spesifikasi, atau rekomendasi untuk mobil tertentu) yang tidak ada di sumber, mengubah maknanya, atau bertentangan dengannya; sebutkan klaim itu di reason.
        2. Fakta Bengkel Vynor Motor sendiri (harga, stok, jam buka, alamat, kontak, booking, pembayaran, garansi, kebijakan) hanya berasal dari <Knowledge>, bukan dari hasil web, dan balasan tidak menambahkan harga, kontak, atau fakta bengkel lain yang tidak ditanyakan.
        3. Balasan singkat: informasi dari web paling banyak sekitar tiga kalimat pendek. Link di akhir balasan tidak dihitung.
        Balasan yang mengatakan informasinya belum tersedia, atau mengalihkan ke staf, memenuhi syarat 1 dan 2.

