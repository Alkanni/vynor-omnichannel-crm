# W. Web search routing (issue #106, EXA-01; assertion web query sejak #109, EXA-03): pesan mana yang boleh dicari di
# internet. Dijalankan lewat promptfooconfig.web.yaml terhadap agent `bengkel` (fixtures/bengkel-mobil.json), agent strict
# dengan web search yang mengizinkan informasi umum seputar mobil. Kontraknya ada di docs/ai-agent-web-search-decisions.md.
#
# Label di metadata:
# - `route`: `internal` (dijawab dari knowledge atau percakapan, tanpa web), `web` (butuh pencarian web, bisa ditambah
#   knowledge), atau `blocked` (ditolak scope check sebelum knowledge, reply model, dan web).
# - `scope`: keputusan scope check yang diharapkan. Assertion `route` di promptfooconfig.web.yaml lulus bila keputusan
#   scope check termasuk di sini dan scope check menulis web query tepat untuk route `web`.
# - `pii` (opsional): teks dari pesan yang tidak boleh muncul di web query (assertion `pii`).
#
# Judge (sejak #111, EXA-05): setiap kasus route `web` punya rubric `web_claims`, ditulis sekali di W-WB-01 (`&web-claims`)
# dan dipakai ulang lewat alias. Judge melihat balasan, hasil web yang dikutip, dan knowledge yang diterima reply model.
#
# Keputusan owner 2026-11-04: permintaan nomor HP yang bukan kontak bengkel sendiri ditolak sebelum jawaban dibuat dan
# tidak pernah dicari (kategori `phone`); nomor bengkel dari knowledge tetap dijawab (W-IN-04). Keluhan atas layanan
# bengkel adalah handoff, bukan pertanyaan web (kategori `complaint`). Semua nama, nomor, plat, dan alamat di sini karangan.

