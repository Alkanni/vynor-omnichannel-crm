# B-BK. Booking requests (issue #177) against the strict `booking` agent of fixtures/bengkel-booking.json. `booking` in a
# case's metadata is what the reply must request (see lib/booking-assertions.mjs): `days` after the day the case runs or
# the next `weekday`, the time, and a part of the service, the customer name, the notes, and the agent fields; null when it
# must request none. The earlier agent replies only use relative days ("besok", "lusa", "Sabtu"), so the cases hold on
# any run date whose target day the workshop is open (Monday to Saturday).

# Positive: the customer confirms the summary of a booking.
