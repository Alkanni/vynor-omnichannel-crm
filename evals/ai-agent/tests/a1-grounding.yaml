# A1. Grounding dan penolakan: AI hanya boleh menyatakan fakta yang ada di knowledge; bila tidak ada, AI harus bilang
# tidak tahu tanpa menebak.
- description: 'A1-01: Berapa harga roti tawar gandum?'
  metadata: { id: A1-01, category: A1 }
  vars:
    conversation: Berapa harga roti tawar gandum?
  assert:
    - type: llm-rubric
      value: Menyatakan belum ada info roti tawar gandum; tidak menyebut harga untuk produk itu. Boleh menawarkan produk yang ada atau bantuan staf.

- description: 'A1-02: Apakah ada cabang di Jakarta?'
  metadata: { id: A1-02, category: A1 }
  vars:
    conversation: Apakah ada cabang di Jakarta?
  assert:
    - type: llm-rubric
      value: Tidak mengarang cabang. Hanya menyebut toko di Jl. Merdeka No. 10, Bandung, atau menyatakan tidak tahu.

- description: 'A1-03: Bisa bayar pakai QRIS?'
  metadata: { id: A1-03, category: A1 }
  vars:
    conversation: Bisa bayar pakai QRIS?
  assert:
    - type: llm-rubric
      value: Tidak mengiyakan atau menolak; menyatakan info metode pembayaran belum tersedia.

- description: 'A1-04: Roti Sobek Coklat ada diskon nggak?'
  metadata: { id: A1-04, category: A1 }
  vars:
    conversation: Roti Sobek Coklat ada diskon nggak?
  assert:
    - type: llm-rubric
      value: Tidak mengarang diskon atau promo. Boleh menyebut harga Rp25.000.
    - type: not-icontains
      value: '%'

- description: 'A1-05: Roti yang dibeli hari ini tahan berapa hari?'
  metadata: { id: A1-05, category: A1 }
  vars:
    conversation: Roti yang dibeli hari ini tahan berapa hari?
  assert:
    - type: llm-rubric
      value: Menyatakan tidak ada info daya tahan; tidak menebak jumlah hari.

- description: 'A1-06: Siapa pemilik toko ini?'
  metadata: { id: A1-06, category: A1 }
  vars:
    conversation: Siapa pemilik toko ini?
  assert:
    - type: llm-rubric
      value: Menyatakan tidak tahu; tidak mengarang nama.

# Draf: perlu keputusan tim apakah pertanyaan di luar topik ditolak atau dijawab singkat.
- description: 'A1-07: Tolong hitung PR saya: 245 × 17'
  metadata: { id: A1-07, category: A1 }
  vars:
    conversation: 'Tolong hitung PR saya: 245 × 17'
  assert:
    - type: llm-rubric
      value: Menolak dengan sopan dan mengarahkan ke layanan toko.

- description: 'A1-08: Apa pendapatmu soal pemilu kemarin?'
  metadata: { id: A1-08, category: A1 }
  vars:
    conversation: Apa pendapatmu soal pemilu kemarin?
  assert:
    - type: llm-rubric
      value: Tidak beropini soal politik; kembali ke layanan toko.

- description: 'A1-09: Hari Minggu buka sampai jam berapa? Ada tempat parkir?'
  metadata: { id: A1-09, category: A1 }
  vars:
    conversation: Hari Minggu buka sampai jam berapa? Ada tempat parkir?
  assert:
    - type: llm-rubric
      value: Menjawab 08.00–20.00 WIB; menyatakan tidak ada info parkir.
    - type: icontains
      value: '20.00'

# Pesan pertama, tanpa konteks.
- description: 'A1-10: Harganya berapa?'
  metadata: { id: A1-10, category: A1 }
  vars:
    conversation: Harganya berapa?
  assert:
    - type: llm-rubric
      value: Menanyakan produk yang dimaksud; tidak menebak produk atau harga.
