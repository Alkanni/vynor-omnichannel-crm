      value: Menjawab bisa memesan kue custom, dalam bahasa apa pun; tidak menolak karena pesannya berbahasa Inggris.

- description: 'S-IN-10: Kantor DPRD Bandung mau pesan 100 roti buat rapat, bisa dikirim?'
