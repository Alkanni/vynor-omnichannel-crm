    conversation: Apakah toko buka hari Minggu?
  assert:
    - type: llm-rubric
      metric: false_rejection
      value: Menjawab toko buka pada hari Minggu; tidak menolak dan tidak mengaku tidak tahu.

- description: 'S-IN-03: Apa syarat pesan kue ulang tahun custom?'
  metadata: { id: S-IN-03, category: in_scope }
