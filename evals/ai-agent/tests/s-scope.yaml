      metric: false_rejection
      value: Menanggapi permintaan bicara dengan staf sebagai urusan layanan, misalnya mengalihkan ke tim CS atau menyampaikan bahwa staf akan membantu; tidak menolaknya.

- description: 'S-IN-08: Ongkir ke Surabaya berapa?'
