# --- Kontrol: jawaban cukup satu chunk; chunk sekitarnya noise (bagian lain, baris tabel lain, atau paragraf lain)

- description: 'C-KT01: Layanan antar cabang Buah Batu'
  metadata:
    id: C-KT01
    category: kontrol
    source: Layanan antar per cabang
    facts:
      - { chunk: 2, text: 'radius 9 km dengan minimal belanja Rp100.000' }
      - { chunk: 2, text: 'Kurir terakhir berangkat pukul 20.00 WIB' }
    noise:
      - { chunk: 1, text: 'radius 6 km dengan minimal belanja Rp75.000' }
      - { chunk: 3, text: 'radius 4 km dengan minimal belanja Rp60.000' }
  vars:
    conversation: Cabang Buah Batu bisa antar sampai radius berapa km, minimal belanjanya berapa, dan kurir terakhir jam berapa?
  assert:
    - *context
    - &noise { type: javascript, metric: noise, value: 'file://lib/context-assertions.mjs:noNoise' }
    - type: llm-rubric
      metric: completeness
      value: >-
        Radius 9 km, minimal belanja Rp100.000, kurir terakhir pukul 20.00 WIB; tidak memakai angka cabang lain.

