    category: retur
    source: Kebijakan retur dan keluhan
    facts:
      - { chunk: 1, text: 'laporan tetap dikirim ke WhatsApp keluhan' }
      - { chunk: 2, text: 'diganti oleh aplikasi sesuai kebijakan aplikasi tersebut' }
      - { chunk: 2, text: 'surat keterangan kerusakan' }
  vars:
    conversation: Kue yang saya pesan lewat aplikasi pesan antar penyok waktu diantar. Lapornya ke mana, dan siapa yang mengganti?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Kerusakan selama pengantaran aplikasi diganti oleh aplikasi sesuai kebijakannya; toko membantu membuat surat
        keterangan kerusakan tetapi tidak mengganti sendiri; laporan ke toko tetap lewat WhatsApp keluhan, bukan lewat
        aplikasi.

# --- Teks tanpa heading seperti hasil ekstraksi PDF (Program reseller (ekstrak PDF), chunk 1–3, terpotong di tengah kalimat)

