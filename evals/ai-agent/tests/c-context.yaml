      - { chunk: 6, text: 'Rp45.000 per figur' }
      - { chunk: 7, text: 'biaya layanan 2,5 persen' }
  vars:
    conversation: Kalau kue custom saya pakai fondant penuh dan dua figur fondant buatan tangan, biaya tambahannya berapa? Kalau bayar pakai kartu kredit ada biaya juga?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Fondant penuh menambah 40 persen dari harga dasar, figur buatan tangan Rp45.000 per figur (dua figur Rp90.000),
        dan kartu kredit dikenakan biaya layanan 2,5 persen.

- description: 'C-BY02: DP pesanan kantor dan pembayaran tunai'
  metadata:
    id: C-BY02
    category: biaya
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 6, text: 'DP-nya 70 persen dari total harga' }
      - { chunk: 7, text: 'hanya diterima sampai Rp5.000.000 per pesanan' }
      - { chunk: 8, text: 'DP cukup 30 persen dari total harga' }
      - { chunk: 8, text: 'surat pesanan resmi bertanda tangan dan berstempel perusahaan' }
  vars:
    conversation: Kantor kami mau pesan 8 kue custom untuk satu tanggal, totalnya sekitar 3 juta. DP-nya berapa, kalau tanpa surat pesanan berapa, dan boleh bayar tunai?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        DP 30 persen bila ada surat pesanan resmi bertanda tangan dan berstempel perusahaan; tanpa itu DP 70 persen
        karena total di atas Rp2.000.000; pembayaran tunai di cabang boleh karena di bawah batas Rp5.000.000 per pesanan.

- description: 'C-BY03: Kue bertingkat, DP, dan pelunasan'
  metadata:
    id: C-BY03
    category: biaya
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 6, text: 'DP-nya 70 persen dari total harga' }
      - { chunk: 6, text: '7730-118-245' }
      - { chunk: 7, text: 'Sisa pembayaran dilunasi paling lambat H-1 pukul 15.00 WIB' }
      - { chunk: 7, text: 'mobil box berpendingin' }
  vars:
    conversation: Saya pesan kue pernikahan 3 tingkat dan minta diantar. DP-nya berapa, bayar ke rekening apa, kapan pelunasan, dan pengantarannya bagaimana?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        DP 70 persen, rekening BCA 7730-118-245 atas nama PT Vynor Roti Nusantara (atau QRIS/tunai), pelunasan paling
        lambat H-1 pukul 15.00 WIB, dan kue bertingkat wajib diantar dengan mobil box berpendingin dengan tambahan Rp50.000.

# --- Aturan lalu pengecualian (Panduan pesanan kue custom, chunk 9–10)

- description: 'C-BT01: Batal H-8, pengembalian DP dan pengecualian'
  metadata:
    id: C-BT01
    category: pembatalan
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 9, text: 'DP dikembalikan 50 persen bila pembatalan dilakukan antara H-9 sampai H-5' }
      - { chunk: 10, text: 'bila pemesan dirawat inap' }
      - { chunk: 10, text: 'tidak bisa dibatalkan setelah H-7' }
  vars:
    conversation: Kalau saya membatalkan pesanan kue custom 8 hari sebelum tanggal ambil, DP saya kembali berapa? Apakah ada pengecualian?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Menjawab bahwa DP kembali 50 persen karena H-8 termasuk H-9 sampai H-5. Menyebut kedua pengecualian: DP kembali
        penuh bila toko tidak sanggup memenuhi desain, terjadi keadaan kahar, atau pemesan dirawat inap; dan pesanan
        dengan figur fondant buatan tangan atau lapisan emas edible tidak bisa dibatalkan setelah H-7.

- description: 'C-BT02: Batal H-2 karena dirawat di rumah sakit'
  metadata:
    id: C-BT02
    category: pembatalan
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 9, text: 'Pembatalan setelah H-5 membuat DP hangus seluruhnya' }
      - { chunk: 9, text: 'Pengembalian dana diproses dalam 14 hari kerja' }
      - { chunk: 10, text: 'surat keterangan rawat inap dari rumah sakit' }
  vars:
    conversation: Saya harus membatalkan pesanan kue custom 2 hari sebelum tanggal ambil karena dirawat di rumah sakit. Apakah DP saya hangus?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Menjawab bahwa DP tidak hangus: walaupun pembatalan setelah H-5 membuat DP hangus, pemesan yang dirawat inap
        mendapat DP kembali penuh dengan surat keterangan rawat inap dari rumah sakit. Menyebut bahwa dana diproses dalam
        14 hari kerja.

- description: 'C-BT03: Batal H-6 untuk kue berlapis emas edible'
  metadata:
    id: C-BT03
    category: pembatalan
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 9, text: 'dikirim tertulis lewat WhatsApp admin pesanan khusus' }
      - { chunk: 9, text: 'DP dikembalikan 50 persen bila pembatalan dilakukan antara H-9 sampai H-5' }
      - { chunk: 10, text: 'walaupun dilakukan sebelum H-5' }
  vars:
    conversation: Pesanan kue custom saya pakai lapisan emas edible. Kalau saya batalkan 6 hari sebelum tanggal ambil, DP-nya bagaimana, dan bagaimana cara membatalkannya?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Untuk pesanan dengan lapisan emas edible, pembatalan setelah H-7 membuat DP hangus walaupun dilakukan sebelum
        H-5, jadi aturan umum 50 persen untuk H-9 sampai H-5 tidak berlaku; pembatalan dikirim tertulis lewat WhatsApp
        admin pesanan khusus dengan nomor pesanan KC-.

# --- Retur: syarat, penggantian, dan pengecualian (Kebijakan retur dan keluhan, chunk 1–3, satu bagian)

