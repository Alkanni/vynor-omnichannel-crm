# C. Konteks multi-chunk (issue #133): pertanyaan yang jawabannya tersebar di beberapa chunk berurutan dari satu sumber,
# terhadap agent `konteks` (fixtures/toko-roti-konteks.json). Di metadata:
# - `source`: judul sumber knowledge yang memuat jawaban.
# - `facts`: teks yang harus ada di chunk terkirim dari sumber itu, dengan `chunk` = posisinya di Knowledge Preview
#   (urutan index). Spasi dan baris baru dibandingkan sebagai satu spasi. context-report.mjs memeriksa posisi ini.
# - `noise` (kasus kontrol): teks dari chunk di sekitar jawaban yang tidak relevan dengan pertanyaan.
# Rubric `completeness` menilai apakah jawaban memuat fakta yang dibutuhkan; asersi `context` dan `noise` dihitung dari
# chunk yang dikirim ke model, tanpa judge.

# --- Prosedur bernomor yang terpotong di tengah langkah (Panduan pesanan kue custom, chunk 3–5)

- description: 'C-PR01: Cara memesan kue custom sampai terkonfirmasi'
  metadata:
    id: C-PR01
    category: prosedur
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 3, text: '0812-4400-7311' }
      - { chunk: 3, text: 'paling lambat 2 x 24 jam setelah nomor pesanan terbit' }
      - { chunk: 4, text: 'otomatis batal dan slot dapurnya dilepas' }
      - { chunk: 4, text: 'Admin mengirim konfirmasi jadwal produksi' }
  vars:
    conversation: Bagaimana cara memesan kue custom dari awal sampai pesanan saya terkonfirmasi?
  assert:
    - &context { type: javascript, metric: context, value: 'file://lib/context-assertions.mjs:sentFacts' }
    - type: llm-rubric
      metric: completeness
      value: >-
        Menjelaskan langkah dari menghubungi admin (WhatsApp 0812-4400-7311 atau kasir), kirim desain, draf desain,
        nomor pesanan KC-, sampai bayar DP paling lambat 2 x 24 jam; menyebut bahwa pesanan otomatis batal bila DP
        tidak dibayar dalam batas itu, dan bahwa admin lalu mengirim konfirmasi jadwal produksi.

- description: 'C-PR02: Kue custom diantar, pemeriksaan dan penyimpanan'
  metadata:
    id: C-PR02
    category: prosedur
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 4, text: 'menerima tautan pelacakan' }
      - { chunk: 5, text: 'paling lambat satu jam setelah serah terima' }
      - { chunk: 5, text: '2 sampai 6 derajat Celsius' }
  vars:
    conversation: Kue custom saya akan diantar. Apa yang perlu saya perhatikan saat kue diterima, dan bagaimana cara menyimpannya?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Menyebut tautan pelacakan saat kurir berangkat, bahwa keluhan kerusakan hanya diterima bila dilaporkan paling
        lambat satu jam setelah serah terima dengan foto kue di dalam kotak, dan penyimpanan kue krim segar di suhu 2–6
        derajat Celsius serta habis dalam tiga hari.

- description: 'C-PR03: Revisi desain dan batas perubahan warna krim'
  metadata:
    id: C-PR03
    category: prosedur
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 3, text: 'Rp35.000 per revisi' }
      - { chunk: 4, text: 'Pada H-3 admin mengirim foto contoh warna krim' }
      - { chunk: 4, text: 'tidak bisa diubah lagi' }
  vars:
    conversation: Berapa kali saya boleh revisi desain kue custom, dan sampai kapan warna krimnya masih bisa diubah?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Revisi gratis dua kali, revisi ketiga dan seterusnya Rp35.000 per revisi; warna krim dicek lewat foto pada H-3
        dan setelah disetujui pada tahap itu tidak bisa diubah lagi.

- description: 'C-PR04: Kue bebas gluten dan batas pelunasan'
  metadata:
    id: C-PR04
    category: prosedur
    source: Panduan pesanan kue custom
    facts:
      - { chunk: 3, text: 'resep bebas gluten hanya tersedia untuk rasa Cokelat dan Pandan' }
      - { chunk: 3, text: 'tambahan biaya Rp40.000' }
      - { chunk: 4, text: 'Pelunasan dilakukan paling lambat H-1 sebelum pukul 15.00 WIB' }
  vars:
    conversation: Saya mau pesan kue custom bebas gluten untuk ulang tahun. Rasa apa saja yang bisa, ada biaya tambahan, dan kapan harus lunas?
  assert:
    - *context
    - type: llm-rubric
      metric: completeness
      value: >-
        Bebas gluten hanya untuk rasa Cokelat dan Pandan dengan tambahan Rp40.000, dan pelunasan paling lambat H-1
        sebelum pukul 15.00 WIB.

# --- Biaya dan ketentuan pembayaran (Panduan pesanan kue custom, chunk 6–8)

- description: 'C-BY01: Biaya fondant, figur, dan kartu kredit'
  metadata:
    id: C-BY01
    category: biaya
    source: Panduan pesanan kue custom
    facts:
