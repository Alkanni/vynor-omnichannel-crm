      - { chunk: 2, text: 'pengembalian dana ke metode pembayaran asal dalam 7 hari kerja' }
  vars:
    conversation: Kue kering yang saya beli 2 hari lalu ternyata berjamur. Masih bisa retur? Lapor ke mana, dan nanti dapat ganti apa?
  assert:
