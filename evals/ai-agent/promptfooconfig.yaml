# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# AI Agent regression eval (issue #71). Run from this directory; see README.md.
description: AI Agent playground regression

prompts:
  - '{{ conversation }}'

providers:
  - id: file://provider.mjs
    label: ai-agent-playground

sharing: false

evaluateOptions:
  maxConcurrency: 2

defaultTest: file://judge.yaml

tests:
  - file://tests/a1-grounding.yaml
  - file://tests/a2-security.yaml
  - file://tests/a3-multi-turn.yaml
  - file://tests/a4-actions.yaml
  - file://tests/b-knowledge.yaml
